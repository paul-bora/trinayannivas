# Free Supabase projects pause after 7 days without activity. This pings the database every 3 days.
# Needs supabase/migrations/0003_keepalive_ping.sql to have been run once.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' -w "\nHTTP %{http_code}\n"
